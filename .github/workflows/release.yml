name: Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name for release (e.g., v1.0.0); unused for publish-only"
        required: false
        type: string
      publish_only:
        description: "Submit the package already uploaded to Chrome Web Store"
        required: false
        default: false
        type: boolean

jobs:
  release:
    name: Release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: chrome-web-store
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        if: ${{ inputs.publish_only == false }}
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Deno
        if: ${{ inputs.publish_only == false }}
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.5"

      - name: Cache Deno dependencies
        if: ${{ inputs.publish_only == false }}
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/deno
            ~/.deno
            node_modules
          key: ${{ runner.os }}-deno-${{ hashFiles('deno.json', 'deno.lock') }}
          restore-keys: |
            ${{ runner.os }}-deno-

      - name: Install dependencies
        if: ${{ inputs.publish_only == false }}
        run: deno install

      - name: Verify release metadata
        if: ${{ inputs.publish_only == false }}
        env:
          RELEASE_REF: ${{ inputs.tag_name }}
        run: deno task release:verify "$RELEASE_REF"

      - name: Ensure release tag is new
        if: ${{ inputs.publish_only == false }}
        env:
          RELEASE_REF: ${{ inputs.tag_name }}
        run: |
          if git rev-parse --quiet --verify "refs/tags/$RELEASE_REF"; then
            echo "Release tag already exists: $RELEASE_REF" >&2
            exit 1
          fi

      - name: Run linter
        if: ${{ inputs.publish_only == false }}
        run: deno task lint

      - name: Check code formatting
        if: ${{ inputs.publish_only == false }}
        run: deno fmt --check

      - name: Run unit tests
        if: ${{ inputs.publish_only == false }}
        run: deno task test

      - name: Build extension for release
        if: ${{ inputs.publish_only == false }}
        run: deno task build

      - name: Create extension package
        if: ${{ inputs.publish_only == false }}
        env:
          RELEASE_REF: ${{ inputs.tag_name }}
        run: (cd dist/release && zip -r "../../markdown-viewer-$RELEASE_REF.zip" .)

      - name: Create GitHub Release
        if: ${{ inputs.publish_only == false }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: "Markdown Viewer ${{ inputs.tag_name }}"
          body_path: CHANGELOG.md
          files: markdown-viewer-${{ inputs.tag_name }}.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          create_credentials_file: false
          export_environment_variables: false

      - name: Upload package to Chrome Web Store
        if: ${{ inputs.publish_only == false }}
        env:
          CWS_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          RELEASE_REF: ${{ inputs.tag_name }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $CWS_ACCESS_TOKEN" \
            --header "Content-Type: application/zip" \
            --data-binary "@markdown-viewer-$RELEASE_REF.zip" \
            "https://chromewebstore.googleapis.com/upload/v2/publishers/$CWS_PUBLISHER_ID/items/$CWS_EXTENSION_ID:upload"

      - name: Submit Chrome Web Store review
        env:
          CWS_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $CWS_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"publishType":"DEFAULT_PUBLISH","deployInfos":[{"deployPercentage":100}],"skipReview":false,"blockOnWarnings":true}' \
            "https://chromewebstore.googleapis.com/v2/publishers/$CWS_PUBLISHER_ID/items/$CWS_EXTENSION_ID:publish"
