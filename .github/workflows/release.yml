name: Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name for release (e.g., v1.0.0)"
        required: true
        type: string

jobs:
  release:
    name: Create Release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.5"

      - name: Cache Deno dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/deno
            ~/.deno
            node_modules
          key: ${{ runner.os }}-deno-${{ hashFiles('deno.json', 'deno.lock') }}
          restore-keys: |
            ${{ runner.os }}-deno-

      - name: Install dependencies
        run: deno install

      - name: Verify release metadata
        id: version
        env:
          RELEASE_REF: ${{ inputs.tag_name }}
        run: |
          deno task release:verify "$RELEASE_REF"
          echo "version=$RELEASE_REF" >> $GITHUB_OUTPUT

      - name: Ensure release tag is new
        env:
          RELEASE_REF: ${{ steps.version.outputs.version }}
        run: |
          if git rev-parse --quiet --verify "refs/tags/$RELEASE_REF"; then
            echo "Release tag already exists: $RELEASE_REF" >&2
            exit 1
          fi

      - name: Run linter
        run: deno task lint

      - name: Check code formatting
        run: deno fmt --check

      - name: Run unit tests
        run: deno task test

      - name: Build extension for release
        run: deno task build

      - name: Create extension package
        run: |
          cd dist/release
          zip -r "../../markdown-viewer-${{ steps.version.outputs.version }}.zip" .
          cd ../..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: "Markdown Viewer ${{ steps.version.outputs.version }}"
          body_path: CHANGELOG.md
          files: |
            markdown-viewer-${{ steps.version.outputs.version }}.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Chrome Web Store (placeholder)
        run: |
          echo "🔄 Chrome Web Store upload placeholder"
          echo "To complete Chrome Web Store integration:"
          echo "1. Create Chrome Web Store Developer account"
          echo "2. Add CHROME_WEB_STORE_* secrets to GitHub"
          echo "3. Uncomment and configure Chrome Web Store upload action"
          echo ""
          echo "Package ready for manual upload: markdown-viewer-${{ steps.version.outputs.version }}.zip"

      # Chrome Web Store upload (commented out - requires setup)
