name: Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name for release (e.g., v1.0.0)"
        required: true
        type: string

jobs:
  prepare:
    name: Prepare release package
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.5"

      - name: Cache Deno dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/deno
            ~/.deno
            node_modules
          key: ${{ runner.os }}-deno-${{ hashFiles('deno.json', 'deno.lock') }}
          restore-keys: |
            ${{ runner.os }}-deno-

      - name: Install dependencies
        run: deno install

      - name: Verify release metadata
        id: version
        env:
          RELEASE_REF: ${{ inputs.tag_name }}
        run: |
          deno task release:verify "$RELEASE_REF"
          echo "version=$RELEASE_REF" >> "$GITHUB_OUTPUT"

      - name: Ensure release tag is new
        env:
          RELEASE_REF: ${{ steps.version.outputs.version }}
        run: |
          if git rev-parse --quiet --verify "refs/tags/$RELEASE_REF"; then
            echo "Release tag already exists: $RELEASE_REF" >&2
            exit 1
          fi

      - name: Run linter
        run: deno task lint

      - name: Check code formatting
        run: deno fmt --check

      - name: Run unit tests
        run: deno task test

      - name: Build extension for release
        run: deno task build

      - name: Create extension package and checksum
        env:
          RELEASE_REF: ${{ steps.version.outputs.version }}
        run: |
          PACKAGE="markdown-viewer-$RELEASE_REF.zip"
          (cd dist/release && zip -r "../../$PACKAGE" .)
          sha256sum "$PACKAGE" > "$PACKAGE.sha256"

      - name: Upload release package
        uses: actions/upload-artifact@v7
        with:
          name: release-package
          path: |
            markdown-viewer-*.zip
            *.sha256
          if-no-files-found: error
          retention-days: 7

  github-release:
    name: Create GitHub Release
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download release package
        uses: actions/download-artifact@v7
        with:
          name: release-package

      - name: Verify package checksum
        env:
          RELEASE_REF: ${{ inputs.tag_name }}
        run: sha256sum --check "markdown-viewer-$RELEASE_REF.zip.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: "Markdown Viewer ${{ needs.prepare.outputs.version }}"
          body_path: CHANGELOG.md
          files: markdown-viewer-${{ needs.prepare.outputs.version }}.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ github.token }}

  cws-upload:
    name: Upload to Chrome Web Store
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: github-release
    runs-on: ubuntu-latest
    environment: chrome-web-store
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.5"

      - name: Download release package
        uses: actions/download-artifact@v7
        with:
          name: release-package

      - name: Verify package checksum
        env:
          RELEASE_REF: ${{ inputs.tag_name }}
        run: sha256sum --check "markdown-viewer-$RELEASE_REF.zip.sha256"

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          create_credentials_file: false
          export_environment_variables: false

      - name: Upload package to Chrome Web Store
        env:
          CWS_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          RELEASE_REF: ${{ inputs.tag_name }}
        run: deno task cws:upload "markdown-viewer-$RELEASE_REF.zip" "${RELEASE_REF#v}"

  cws-publish:
    name: Submit Chrome Web Store review
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: cws-upload
    runs-on: ubuntu-latest
    environment: chrome-web-store
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.5"

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          create_credentials_file: false
          export_environment_variables: false

      - name: Submit Chrome Web Store review
        env:
          CWS_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          RELEASE_REF: ${{ inputs.tag_name }}
        run: deno task cws:publish "${RELEASE_REF#v}"
